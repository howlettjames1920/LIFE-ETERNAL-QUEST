-size:14px;margin-bottom:8px}.practice-emoji{height:29px;width:29px;display:grid;place-items:center;border-radius:10px;background:#f0ecff}.practice-grid{display:grid;grid-template-columns:1fr;gap:7px}.practice{border:1px solid var(--line);border-radius:13px;padding:10px;display:flex;gap:9px;align-items:flex-start;background:#fff;transition:background .15s,border .15s}.practice:has(input:checked){background:#eafff8;border-color:#a7ead9}.practice input{accent-color:var(--mint);width:18px;height:18px;margin:2px 0 0;flex-shrink:0}.practice strong{font-size:12px;display:block}.practice small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.practice input:checked+span strong{color:#087c6b}.notice{border-radius:13px;padding:12px 13px;font-size:11px;line-height:1.55;background:#fff7e8;border:1px solid #ffe4b7;color:#81561d;margin-top:12px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:#716d88;border-radius:99px;padding:8px 12px;font-size:11px;font-weight:800}.tab.active{background:#251c4e;color:#fff;border-color:#251c4e}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}.data-table{width:100%;border-collapse:collapse;min-width:560px;font-size:11px}.data-table th{background:#f8f6ff;color:#77718e;text-align:left;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.data-table td{padding:10px;border-bottom:1px solid #f0edf6;vertical-align:top}.data-table tr:last-child td{border-bottom:0}.progress-cards{grid-template-columns:1fr}.smallmuted{color:var(--muted);font-size:11px}.weekchips{display:flex;flex-wrap:wrap;gap:7px}.weekchip{background:#f4f1ff;padding:7px 9px;border-radius:10px;font-size:11px;color:#6352a7;font-weight:750}.desktop-only{display:none}.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:95px;background:#211b45;color:white;padding:11px 16px;border-radius:13px;box-shadow:var(--shadow);font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:all .2s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modalback{position:fixed;inset:0;background:#13102788;z-index:40;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:20px;padding:20px;max-width:440px;width:100%;box-shadow:var(--shadow)}.modal h3{margin:0 0 8px}.modal p{font-size:12px;color:var(--muted)}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(min-width:700px){.app{padding-bottom:25px}.topbar{padding:25px max(24px,calc((100vw - 1120px)/2)) 30px;border-radius:0 0 35px 35px}.wrap{padding:24px 22px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.quick-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.two-col{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}.practice-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.progress-cards{grid-template-columns:repeat(2,minmax(0,1fr))}.bottomnav{position:sticky;top:0;bottom:auto;max-width:1120px;margin:0 auto;padding:11px 15px;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:0 0 18px 18px;box-shadow:var(--shadow)}.navbtn{flex-direction:row;font-size:12px;gap:7px}.navbtn .navicon{font-size:17px}.hero{margin-top:26px}.stat{padding:18px}.formgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.field.full{grid-column:1/-1}.desktop-only{display:inline}.practice-grid{gap:8px}}

<div class="app" id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const KEY='lifeEternalQuest.v1';
const DEFAULTS={age:27,heightCm:167.6,startWeight:68,targetWeight:70,stepTarget:7000};
const routines={
'Mon • Upper A':['Dumbbell bench press','One-arm dumbbell row','Seated dumbbell shoulder press','Lat pulldown','Dumbbell lateral raise','Triceps cable pushdown','Dead bug'],
'Tue • Lower A':['Goblet squat','Dumbbell Romanian deadlift','Reverse lunge','Standing calf raise','Front plank'],
'Wed • Active recovery':['Easy walk','Mobility flow','Cat–Cow','Body scan'],
'Thu • Upper B':['Incline dumbbell press','Seated cable row','Lat pulldown','Face pull','Dumbbell biceps curl','Side plank'],
'Fri • Lower B':['Leg press','Hip thrust','Seated hamstring curl','Step-up','Bird dog','Farmer carry'],
'Sat • Cardio + mobility':['Brisk walk','Cycling','Gentle yoga flow'],
'Sun • Rest + reflection':['Optional easy walk','Gratitude journaling']};
const exerciseType={};Object.entries(routines).forEach(([k,arr])=>arr.forEach(x=>exerciseType[x]=/walk|cycling/i.test(x)?'Cardio':/yoga|mobility|cat–cow|body scan/i.test(x)?'Mobility':/plank|dead bug|bird dog/i.test(x)?'Core':'Strength'));
const practices={
 Yoga:[['Surya Namaskar','Sun Salutation · 2–6 slow rounds'],['Tadasana','Mountain Pose · 30–60 sec'],['Vrikshasana','Tree Pose · 20–40 sec/side'],['Trikonasana','Triangle Pose · 20–40 sec/side'],['Virabhadrasana II','Warrior II · 20–40 sec/side'],['Bhujangasana','Cobra · 3–5 easy breaths'],['Marjaryasana–Bitilasana','Cat–Cow · 6–10 cycles'],['Balasana','Child’s Pose · 30–60 sec'],['Setu Bandhasana','Bridge · 6–10 reps'],['Pavanamuktasana','Wind-Relieving Pose · 3–5 breaths/side'],['Shavasana','Corpse Pose · 3–10 min']],
 Pranayama:[['Dirgha / diaphragmatic breathing','2–5 min · easy lower-rib breathing'],['Nadi Shodhana','2–5 min · no breath holds'],['Anulom Vilom','2–5 min · gentle alternate-nostril breathing'],['Bhramari','Humming bee breath · 5–8 soft rounds'],['Ujjayi','Soft ocean breath · 1–3 min'],['Sheetali / Sheetkari','Cooling-style breath · 3–6 easy rounds'],['Kapalabhati*','Supervised only · vigorous active exhalation'],['Bhastrika*','Supervised only · vigorous breathing']],
 Meditation:[['Breath awareness','3–10 min'],['Mindfulness sitting','3–10 min'],['Body scan','5–15 min'],['Mantra meditation','3–10 min'],['Loving-kindness (Metta)','3–10 min'],['Yoga Nidra','5–20 min'],['Walking meditation','5–15 min'],['Trataka (steady gaze)','30–60 sec, then rest']],
 Japa:[['Om Japa','1–5 min or 1 mala'],['So Hum Japa','2–5 min'],['Gayatri Mantra','Choose a comfortable count'],['Maha Mrityunjaya Mantra','Choose a comfortable count'],['Hare Krishna Mahamantra','Choose a comfortable count'],['Personal mantra','1–5 min or chosen count']]
};
const tips={Yoga:'Move gently, stay pain-free, and use supports where helpful.',Pranayama:'Keep the breath comfortable. Do not force breathing or hold it unless appropriately trained.',Meditation:'There is no perfect session. Gently return attention when it wanders.',Japa:'Choose a mantra that fits your own beliefs and tradition. Record your preferred count.'};
const flatPractice=Object.entries(practices).flatMap(([cat,arr])=>arr.map(p=>({category:cat,name:p[0],dose:p[1]})));
let screen='Home',spiritFilter='All',historyFilter='All',db=loadDB();
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');return {settings:{...DEFAULTS,...(x.settings||{})},daily:x.daily||{},workouts:x.workouts||[],spiritual:x.spiritual||{},prefs:x.prefs||{}}}catch(e){return {settings:{...DEFAULTS},daily:{},workouts:[],spiritual:{},prefs:{}}}}
function saveDB(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){toast('Storage is full. Export a backup and remove old data.');}}
function isoNow(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shiftDate(date,days){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function fmtDate(s){if(!s)return '';const d=new Date(s+'T12:00:00');return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function dayShort(s){return new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function allDays(){return Object.keys(db.daily).sort()}
function loggedDays(){return allDays().filter(d=>Object.values(db.daily[d]||{}).some(v=>v!==''&&v!==null&&v!==undefined))}
function totalChecked(s){return (db.spiritual[s]?.checked||[]).length}
function totalJapa(){return Object.values(db.spiritual).reduce((a,x)=>a+num(x.japaRounds),0)}
function totalSetCount(){return db.workouts.length}
function avg(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0}
function streak(){let n=0,d=isoNow();while((db.daily[d]&&num(db.daily[d].steps)>0)||totalChecked(d)>0||db.workouts.some(x=>x.date===d)){n++;d=shiftDate(d,-1)}return n}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2300)}
function svgLine(data,color='#7655e8',unit='',id='chart'){let vals=data.map(x=>x.v);if(!vals.length)return '<div class="empty">Your chart will grow as you log entries.</div>';let w=520,h=170,pad=25,min=Math.min(...vals),max=Math.max(...vals);if(min===max){min*=.97;max=max*1.03+0.01}let points=vals.map((v,i)=>({x:pad+i*(w-2*pad)/Math.max(1,vals.length-1),y:h-pad-(v-min)/(max-min)*(h-2*pad),v}));let poly=points.map(p=>p.x+','+p.y).join(' '),dots=points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}"/><title>${p.v}${unit}</title>`).join('');let labels=points.map((p,i)=>[0,Math.floor((points.length-1)/2),points.length-1].includes(i)?`<text x="${p.x}" y="${h-4}" text-anchor="middle" class="chart-label">${esc(data[i].label)}</text>`:'').join('');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(id)} chart"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#e7e2f3"/><line x1="${pad}" y1="${pad}" x2="${w-pad}" y2="${pad}" stroke="#f1eef8"/><polyline fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}"/>${dots}${labels}</svg>`}
function barList(rows,maxv){if(!rows.length)return '<div class="empty">No entries yet. Start logging to fill your quest bars.</div>';return `<div class="barlist">${rows.map(r=>`<div class="barrow"><span class="barname">${esc(r.name)}</span><div class="track"><div class="fill" style="width:${Math.min(100,maxv?100*r.v/maxv:0)}%"></div></div><span class="barval">${r.v}</span></div>`).join('')}</div>`}
function todayStats(){let d=isoNow(),daily=db.daily[d]||{},s=db.spiritual[d]||{},checked=(s.checked||[]).length;return {weight:daily.weight||'—',steps:num(daily.steps),sets:db.workouts.filter(x=>x.date===d).length,checked,percent:Math.round(100*checked/flatPractice.length),japa:num(s.japaRounds)}}
function topbar(){return `<header class="topbar"><div class="toprow"><div class="brand"><div class="brandmark">✦</div><div><div class="brandname">LIFE ETERNAL QUEST</div><div class="tagline">Fitness • Focus • Inner Growth</div></div></div><div class="datepill">☼ ${new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div></div><div class="hero"><div class="eyebrow">YOUR PERSONAL QUEST JOURNAL</div><h1>Become stronger.<br>Return to yourself.</h1><p>A little strength, a little stillness, a little progress — every day counts.</p><div class="hero-actions"><button class="btn btn-light" data-nav="Daily">＋ Daily check-in</button><button class="btn btn-light" data-nav="Spirit">✧ Spiritual quest</button></div></div></header>`}
const navItems=[['Home','⌂'],['Daily','☼'],['Train','↗'],['Spirit','✧'],['Progress','▥'],['Backup','⇧']];
function nav(){return `<nav class="bottomnav" aria-label="Main navigation">${navItems.map(([n,i])=>`<button class="navbtn ${screen===n?'active':''}" data-nav="${n}"><span class="navicon">${i}</span><span>${n}</span></button>`).join('')}</nav>`}
function appShell(content){document.getElementById('app').innerHTML=topbar()+nav()+`<main class="wrap">${content}</main>`;bindCommon()}
function home(){let s=todayStats(),ds=loggedDays().map(d=>({label:dayShort(d),v:num(db.daily[d].weight)})).filter(x=>x.v).slice(-10),recentSteps=Array.from({length:7},(_,i)=>{let d=shiftDate(isoNow(),i-6);return {name:dayShort(d),v:num(db.daily[d]?.steps)}}),cats=Object.keys(practices).map(c=>({name:c,v:Object.values(db.spiritual).reduce((a,x)=>a+(x.checked||[]).filter(n=>practices[c].some(p=>p[0]===n)).length,0)})),maxCat=Math.max(1,...cats.map(x=>x.v));let dailyPct=s.percent;return `<div class="section-head"><div><h2>Your command centre</h2><p>Small wins build a life you’re proud to live.</p></div><span class="badge">DAY ${Math.max(1,Math.floor((Date.now()-new Date('2026-10-26T12:00:00').getTime())/86400000)+1)} OF YOUR QUEST</span></div>

function progressPage(){let ds=loggedDays().map(d=>({label:dayShort(d),v:num(db.daily[d].weight)})).filter(x=>x.v).slice(-30),stepDays=Array.from({length:14},(_,i)=>{let d=shiftDate(isoNow(),i-13);return {name:dayShort(d),v:num(db.daily[d]?.steps)}}),cats=Object.keys(practices).map(c=>({name:c,v:Object.values(db.spiritual).reduce((a,x)=>a+(x.checked||[]).filter(n=>practices[c].some(p=>p[0]===n)).length,0)})),dailyCount=loggedDays().length,daysWeight=loggedDays().filter(d=>num(db.daily[d].weight)>0),first=daysWeight[0],last=daysWeight[daysWeight.length-1],weightDiff=daysWeight.length>=2&&first&&last?num(db.daily[last].weight)-num(db.daily[first].weight):null;let dates=Object.keys(db.spiritual).sort(),totalChecks=dates.reduce((a,d)=>a+(db.spiritual[d].checked||[]).length,0),totalPotential=dates.length*flatPractice.length;let completion=totalPotential?Math.round(totalChecks/totalPotential*100):0;let workoutDays=new Set(db.workouts.map(x=>x.date)).size;return `<div class="section-head"><div><h2>Progress & patterns</h2><p>Use your logs to notice trends, not judge individual days.</p></div></div><div class="grid stats"><div class="stat"><div class="stat-top">DAYS LOGGED <span class="stat-icon tint-purple">📅</span></div><div class="stat-value">${dailyCount}</div><div class="stat-note">Days with any daily check-in</div></div><div class="stat"><div class="stat-top">WEIGHT CHANGE <span class="stat-icon tint-mint">⚖️</span></div><div class="stat-value">${weightDiff===null?'—':(weightDiff>0?'+':'')+weightDiff.toFixed(1)+' kg'}</div><div class="stat-note">First to latest saved weigh-in</div></div><div class="stat"><div class="stat-top">WORKOUT DAYS <span class="stat-icon tint-orange">💪</span></div><div class="stat-value">${workoutDays}</div><div class="stat-note">Distinct dates with logged exercise sets</div></div><div class="stat"><div class="stat-top">JAPA ROUNDS <span class="stat-icon tint-pink">📿</span></div><div class="stat-value">${totalJapa()}</div><div class="stat-note"> function render(){let content=screen==='Home'?home():screen==='Daily'?dailyPage():screen==='Train'?trainPage():screen==='Spirit'?spiritPage():screen==='Progress'?progressPage():backupPage();appShell(content);window.scrollTo({top:0,behavior:'smooth'});}
function bindCommon(){document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{screen=b.dataset.nav;render()}));document.querySelectorAll('[data-spfilter]').forEach(b=>b.addEventListener('click',()=>{spiritFilter=b.dataset.spfilter;render()}));document.querySelectorAll('[data-edit-day]').forEach(b=>b.addEventListener('click',()=>{let d=b.dataset.editDay;screen='Daily';render();document.getElementById('dDate').value=d;fillDaily(d)}));document.querySelectorAll('[data-del-workout]').forEach(b=>b.addEventListener('click',()=>{db.workouts=db.workouts.filter(x=>x.id!==b.dataset.delWorkout);saveDB();render();toast('Workout entry deleted')}));document.querySelectorAll('[data-export]').forEach(b=>b.addEventListener('click',()=>exportCsv('workouts')));
let df=document.getElementById('dailyForm');if(df)df.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(df),d=f.get('dDate');let x={};['weight','steps','waist','sleep','water','protein','energy','trained','notes'].forEach(k=>x[k]=String(f.get(k)||''));db.daily[d]=x;saveDB();render();toast('Daily check-in saved')});let clearD=document.getElementById('clearDaily');if(clearD)clearD.addEventListener('click',()=>{let d=document.getElementById('dDate').value;if(db.daily[d]){delete db.daily[d];saveDB();render();toast('Daily entry cleared')}else toast('No saved entry for this date')});let dDate=document.getElementById('dDate');if(dDate)dDate.addEventListener('change',()=>fillDaily(dDate.value));
let routine=document.getElementById('routineSelect');if(routine)routine.addEventListener('change',()=>{let ex=routine.value;if(!ex)return;document.getElementById('exercise').value=ex;document.getElementById('wType').value=exerciseType[ex]||'Strength';document.getElementById('wDate').value=isoNow();document.getElementById('exercise').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('exercise').focus({preventScroll:true})});let wf=document.getElementById('workoutForm');if(wf)wf.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(wf),x={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),created:Date.now(),date:f.get('wDate'),type:f.get('type'),exercise:String(f.get('exercise')||'').trim(),setNo:f.get('setNo')||1,load:f.get('load')||'',reps:f.get('reps')||'',duration:f.get('duration')||'',calories:f.get('calories')||'',rpe:f.get('rpe')||'',notes:f.get('notes')||''};if(!x.exercise){toast('Enter an exercise name');return}db.workouts.push(x);saveDB();render();toast('Set saved — one more step forward')});
let spiritD=document.getElementById('spiritDate');if(spiritD)spiritD.addEventListener('change',()=>render());document.querySelectorAll('[data-spirit]').forEach(el=>el.addEventListener('change',()=>{let d=document.getElementById('spiritDate')?.value||isoNow();if(!db.spiritual[d])db.spiritual[d]={checked:[],minutes:{},japaRounds:'',reflection:''};let s=db.spiritual[d],name=el.dataset.spirit,set=new Set(s.checked||[]);el.checked?set.add(name):set.delete(name);s.checked=[...set];saveDB();let n=set.size,p=Math.round(n/flatPractice.length*100);let a=document.getElementById('spiritPercent'),b=document.getElementById('spiritProgressTitle'),c=document.getElementById('spiritProgressNote');if(a)a.textContent=p+'%';if(b)b.textContent="Today's practice map";if(c)c.textContent=n?`${n} practice${n===1?'':'s'} completed today.`:'Choose any meaningful combination. Even five mindful minutes count.';let badge=document.querySelector('.section-head .badge');if(badge)badge.textContent=`${n}/${flatPractice.length} DONE`;let group=el.closest('.practice-group');if(group){let catTitle=group.querySelector('.practice-title'),checks=group.querySelectorAll('[data-spirit]'),done=group.querySelectorAll('[data-spirit]:checked').length;if(catTitle){let bdg=catTitle.querySelector('.badge');if(bdg)bdg.textContent=`${done}/${checks.length}`}}}));document.querySelectorAll('[data-spmeta]').forEach(el=>{const save=()=>{let d=document.getElementById('spiritDate')?.value||isoNow();if(!db.spiritual[d])db.spiritual[d]={checked:[],minutes:{},japaRounds:'',reflection:''};let [a,b]=el.dataset.spmeta.split('.');if(a==='minutes')db.spiritual[d].minutes[b]=el.value;else db.spiritual[d][a]=el.value;saveDB()};el.addEventListener(el.tagName==='TEXTAREA'?'blur':'change',save)});
let sf=document.getElementById('settingsForm');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();let vals={age:document.getElementById('setAge').value,heightCm:document.getElementById('setHeight').value,startWeight:document.getElementById('setStartWeight').value,targetWeight:document.getElementById('setTargetWeight').value,stepTarget:document.getElementById('setStepTarget').value};Object.keys(vals).forEach(k=>{if(vals[k]!==''&&Number.isFinite(Number(vals[k])))db.settings[k]=Number(vals[k])});saveDB();render();toast('Goals updated')});
let bj=document.getElementById('backupJson');if(bj)bj.addEventListener('click',exportJson);let ed=document.getElementById('exportDaily');if(ed)ed.addEventListener('click',()=>exportCsv('daily'));let ew=document.getElementById('exportWorkouts');if(ew)ew.addEventListener('click',()=>exportCsv('workouts'));let es=document.getElementById('exportSpirit');if(es)es.addEventListener('click',()=>exportCsv('spiritual'));let restore=document.getElementById('restoreJson');if(restore)restore.addEventListener('click',restoreJson);let reset=document.getElementById('resetAll');if(reset)reset.addEventListener('click',()=>confirmModal('Reset all local data?','This erases every daily, workout, spiritual and goal entry stored in this browser. Export a backup first.','Reset data',()=>{localStorage.removeItem(KEY);db={settings:{...DEFAULTS},daily:{},workouts:[],spiritual:{},prefs:{}};render();toast('Local data reset')}));}
function fillDaily(d){let x=db.daily[d]||{};['weight','steps','waist','sleep','water','protein','energy','trained'].forEach(k=>{let el=document.getElementById(k);if(el)el.value=x[k]??''});let n=document.getElementById('dailyNotes');if(n)n.value=x.notes||''}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function exportJson(){downloadBlob(new Blob([JSON.stringify({app:'Life Eternal Quest',version:1,exportedAt:new Date().toISOString(),...db},null,2)],{type:'application/json'}),`life-eternal-quest-backup-${isoNow()}.json`);toast('Full backup exported')}
function csv(rows){return rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function exportCsv(type){let rows=[],name='';if(type==='daily'){rows=[['Date','Weight kg','Steps','Waist cm','Sleep hours','Water L','Protein g','Energy 1-5','Training','Notes'],...loggedDays().sort().map(d=>[d,...['weight','steps','waist','sleep','water','protein','energy','trained','notes'].map(k=>db.daily[d]?.[k]??'')])];name='daily-log'}else if(type==='workouts'){rows=[['Date','Exercise Type','Exercise','Set','Load kg','Reps','Duration min','Calories burned','RPE','Notes'],...db.workouts.map(x=>[x.date,x.type,x.exercise,x.setNo,x.load,x.reps,x.duration,x.calories,x.rpe,x.notes])];name='workout-log'}else{rows=[['Date','Category','Practice','Completed','Yoga minutes','Pranayama minutes','Meditation minutes','Japa minutes','Japa rounds','Reflection']];Object.keys(db.spiritual).sort().forEach(d=>{let s=db.spiritual[d];flatPractice.forEach(p=>rows.push([d,p.category,p.name,(s.checked||[]).includes(p.name)?'Yes':'No',s.minutes?.Yoga||'',s.minutes?.Pranayama||'',s.minutes?.Meditation||'',s.minutes?.Japa||'',s.japaRounds||'',s.reflection||'']))});name='spiritual-log'}downloadBlob(new Blob(['\ufeff'+csv(rows)],{type:'text/csv;charset=utf-8'}),`${name}-${isoNow()}.csv`);toast('CSV exported')}
function restoreJson(){let file=document.getElementById('restoreFile')?.files?.[0];if(!file){toast('Choose a JSON backup file first');return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||typeof x!=='object'||!x.daily||!Array.isArray(x.workouts)||!x.spiritual)throw Error('Invalid backup format');confirmModal('Restore this backup?','This replaces data currently stored in this browser with the selected backup.','Restore',()=>{db={settings:{...DEFAULTS,...(x.settings||{})},daily:x.daily||{},workouts:x.workouts||[],spiritual:x.spiritual||{},prefs:x.prefs||{}};saveDB();render();toast('Backup restored')})}catch(e){toast('That file does not look like a valid Life Eternal Quest backup')}};r.readAsText(file)}
function confirmModal(title,body,ok,action){let div=document.createElement('div');div.className='modalback';div.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="modal-actions"><button class="btn btn-soft" id="modalCancel">Cancel</button><button class="btn btn-danger" id="modalOK">${esc(ok)}</button></div></div>`;document.body.appendChild(div);div.querySelector('#modalCancel').onclick=()=>div.remove();div.querySelector('#modalOK').onclick=()=>{div.remove();action()};div.addEventListener('click',e=>{if(e.target===div)div.remove()})}
// Register offline cache only when served over HTTPS/localhost; opening index.html directly still allows local logging in supported browsers.
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
})();
